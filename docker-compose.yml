name: food-point
services:
    postgres:
        image: postgres:16-alpine
        restart: always
        environment:
            POSTGRES_DB: foodpoint
            POSTGRES_USER: foodpoint
            POSTGRES_PASSWORD: foodpoint
        networks:
            - food-point-network
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "foodpoint"]
            interval: 5s
            retries: 10

    backend:
        build:
            context: ./
            dockerfile: dockerfile
        depends_on:
            postgres:
                condition: service_healthy
        ports:
            - "${PORT:-3000}:3000"
        environment:
            PORT: 3000
            DB_HOST: postgres
            DB_PORT: 5432
            DB_USER: foodpoint
            DB_PASSWORD: foodpoint
            DB_DATABASE_NAME: foodpoint
            # Local only: set your own when running anywhere else.
            SECRET_KEY_JWT: ${SECRET_KEY_JWT:-local-dev-secret}
        command: >
            sh -c "npm run migrate && npm run start"
        restart: always
        networks:
            - food-point-network

networks:
    food-point-network:
        driver: bridge
